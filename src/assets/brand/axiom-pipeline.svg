<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" width="1600" height="420" role="img" aria-label="AxiomDSF ten-agent pipeline: REQ, HLS, HLD, US, TR, LLD, TDD, CODE, SCA, SEC igniting in sequence">
  <defs>
    <linearGradient id="ax-plasma" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="ax-node" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#EDE9FE"/>
      <stop offset="0.45" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </radialGradient>
    <filter id="ax-bloom" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="ax-grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <linearGradient id="ax-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#000" stop-opacity="1"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <mask id="ax-fade-mask"><rect width="1600" height="420" fill="url(#ax-fade)"/></mask>
  </defs>

  <style>
    :root{}
    .spine{stroke:url(#ax-plasma);stroke-width:2;fill:none;stroke-linecap:round}
    .flow{stroke:url(#ax-plasma);stroke-width:3;fill:none;stroke-linecap:round;
          stroke-dasharray:26 200;filter:url(#ax-bloom);
          animation:ax-flow 4.2s linear infinite}
    .node-glow{fill:url(#ax-node);filter:url(#ax-bloom);opacity:.18;transform-box:fill-box;transform-origin:center;
               animation:ax-pulse 10s ease-in-out infinite}
    .node-core{fill:url(#ax-node);opacity:.32;transform-box:fill-box;transform-origin:center;
               animation:ax-core 10s ease-in-out infinite}
    .node-ring{fill:none;stroke:#FFFFFF;stroke-opacity:.14;stroke-width:1}
    .idx{fill:#61677A;font:600 13px/1 'Azeret Mono',ui-monospace,monospace;letter-spacing:.12em;text-anchor:middle}
    .lbl{fill:#9BA1B4;font:600 15px/1 'Azeret Mono',ui-monospace,monospace;letter-spacing:.14em;text-anchor:middle;
         transform-box:fill-box;transform-origin:center;animation:ax-lbl 10s ease-in-out infinite}
    .n0 .node-glow,.n0 .node-core,.n0 .lbl{animation-delay:0s}
    .n1 .node-glow,.n1 .node-core,.n1 .lbl{animation-delay:.55s}
    .n2 .node-glow,.n2 .node-core,.n2 .lbl{animation-delay:1.1s}
    .n3 .node-glow,.n3 .node-core,.n3 .lbl{animation-delay:1.65s}
    .n4 .node-glow,.n4 .node-core,.n4 .lbl{animation-delay:2.2s}
    .n5 .node-glow,.n5 .node-core,.n5 .lbl{animation-delay:2.75s}
    .n6 .node-glow,.n6 .node-core,.n6 .lbl{animation-delay:3.3s}
    .n7 .node-glow,.n7 .node-core,.n7 .lbl{animation-delay:3.85s}
    .n8 .node-glow,.n8 .node-core,.n8 .lbl{animation-delay:4.4s}
    .n9 .node-glow,.n9 .node-core,.n9 .lbl{animation-delay:4.95s}
    @keyframes ax-flow{to{stroke-dashoffset:-226}}
    @keyframes ax-pulse{0%,74%,100%{opacity:.16;transform:scale(1)}12%{opacity:.9;transform:scale(1.32)}24%{opacity:.4;transform:scale(1.08)}}
    @keyframes ax-core{0%,74%,100%{opacity:.3;transform:scale(1)}12%{opacity:1;transform:scale(1.14)}24%{opacity:.55;transform:scale(1)}}
    @keyframes ax-lbl{0%,74%,100%{fill:#9BA1B4;transform:translateY(0)}12%{fill:#F2F3F7;transform:translateY(-1px)}}
    @media (prefers-reduced-motion:reduce){
      .flow{animation:none;stroke-dasharray:none;opacity:.7}
      .node-glow{animation:none;opacity:.32}.node-core{animation:none;opacity:.7}.lbl{animation:none;fill:#F2F3F7}
    }
  </style>

  <rect width="1600" height="420" fill="#06070B"/>
  <rect width="1600" height="420" fill="url(#ax-grid)" mask="url(#ax-fade-mask)"/>
  <ellipse cx="230" cy="210" rx="360" ry="240" fill="#6D28D9" opacity="0.16" filter="url(#ax-bloom)"/>
  <ellipse cx="1370" cy="210" rx="360" ry="240" fill="#0E7490" opacity="0.16" filter="url(#ax-bloom)"/>

  <path class="spine" d="M120 210 H1480"/>
  <path class="flow"  d="M120 210 H1480"/>

  <!-- nodes: x = 120 + i*151.11 -->
  <g class="n0" transform="translate(120,210)"><circle class="node-glow" r="40"/><circle class="node-core" r="21"/><circle class="node-ring" r="21"/><text class="idx" y="-56">01</text><text class="lbl" y="86">REQ</text></g>
  <g class="n1" transform="translate(271,210)"><circle class="node-glow" r="40"/><circle class="node-core" r="21"/><circle class="node-ring" r="21"/><text class="idx" y="-56">02</text><text class="lbl" y="86">HLS</text></g>
  <g class="n2" transform="translate(422,210)"><circle class="node-glow" r="40"/><circle class="node-core" r="21"/><circle class="node-ring" r="21"/><text class="idx" y="-56">03</text><text class="lbl" y="86">HLD</text></g>
  <g class="n3" transform="translate(573,210)"><circle class="node-glow" r="40"/><circle class="node-core" r="21"/><circle class="node-ring" r="21"/><text class="idx" y="-56">04</text><text class="lbl" y="86">US</text></g>
  <g class="n4" transform="translate(725,210)"><circle class="node-glow" r="40"/><circle class="node-core" r="21"/><circle class="node-ring" r="21"/><text class="idx" y="-56">05</text><text class="lbl" y="86">TR</text></g>
  <g class="n5" transform="translate(876,210)"><circle class="node-glow" r="40"/><circle class="node-core" r="21"/><circle class="node-ring" r="21"/><text class="idx" y="-56">06</text><text class="lbl" y="86">LLD</text></g>
  <g class="n6" transform="translate(1027,210)"><circle class="node-glow" r="40"/><circle class="node-core" r="21"/><circle class="node-ring" r="21"/><text class="idx" y="-56">07</text><text class="lbl" y="86">TDD</text></g>
  <g class="n7" transform="translate(1178,210)"><circle class="node-glow" r="40"/><circle class="node-core" r="21"/><circle class="node-ring" r="21"/><text class="idx" y="-56">08</text><text class="lbl" y="86">CODE</text></g>
  <g class="n8" transform="translate(1329,210)"><circle class="node-glow" r="40"/><circle class="node-core" r="21"/><circle class="node-ring" r="21"/><text class="idx" y="-56">09</text><text class="lbl" y="86">SCA</text></g>
  <g class="n9" transform="translate(1480,210)"><circle class="node-glow" r="40"/><circle class="node-core" r="21"/><circle class="node-ring" r="21"/><text class="idx" y="-56">10</text><text class="lbl" y="86">SEC</text></g>
</svg>
