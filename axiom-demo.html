ling"},{k:"Scale",v:"45,000 SKUs \xd7 3 DCs = 135,000 positions; ~400k ledger entries/day"},{k:"Retention",v:"Ledger retained 7 years, queryable at any historic date"},{k:"Recovery",v:"Positions fully reconstructible by replaying the ledger"}],risks:[{r:"Overselling the last unit under concurrency",i:"Critical \u2014 the reason for the project",mit:"Conditional UPDATE with the availability predicate in the WHERE clause; zero rows updated means insufficient stock. Atomic, no read-then-write window, no application lock."},{r:"Ledger and position drift apart",i:"High",mit:"Position is derived from the ledger, plus a nightly reconciliation job that recomputes from scratch and alerts on any difference."},{r:"Expired allocations strand stock",i:"High",mit:"A sweeper expires holds past expiresAt; the expiry is also evaluated lazily on read so a stalled sweeper cannot hide stock."},{r:"Duplicate suggestions spam buyers",i:"Medium",mit:"Partial unique index on (sku, location) WHERE state = OPEN."},{r:"Handheld retries create duplicate movements",i:"High",mit:"Every movement carries a client-supplied idempotency key, unique in the ledger."},{r:"Cycle count approved by the counter",i:"Medium",mit:"Enforced in the domain: approvedBy must differ from countedBy above the threshold, tested explicitly."}],unknowns:["How long should an allocation hold before expiring \u2014 is it the same for store and online orders?","What is the variance threshold, and is it absolute units or a percentage of on-hand?","Should a transfer in flight count as on-order for replenishment at the destination?","Who owns reorder points until the forecasting system arrives?","Are partial picks allowed against a single allocation, or is it all-or-nothing?","Does a return go back to available immediately, or into a quarantine location first?"],integrations:["Store and online order systems \u2014 allocate/release over REST, service credentials","Supplier EDI \u2014 inbound advance shipping notices","Handheld terminals \u2014 REST over the warehouse WLAN, offline queue with idempotency keys","Finance \u2014 nightly stock valuation extract","Future forecasting system \u2014 will write reorder points; the seam exists in v1"],outOfScope:["Warehouse robotics and conveyor integration","Carrier selection and shipping labels","Demand forecasting","Store-level inventory","Returns grading and refurbishment","Supplier payment"],stories:[{id:"US-001",title:"Allocate stock to an order",as:"the order system",want:"to reserve stock when an order is accepted",so:"we never promise what we do not have",points:8,ac:["Allocation succeeds when available \u2265 requested and creates a HELD allocation","Allocation fails with 409 INSUFFICIENT_STOCK when available < requested, changing nothing","Concurrent requests for the last unit \u2014 exactly one succeeds"],edge:["Requesting zero or negative quantity is rejected","Allocating an inactive SKU is rejected","A retried request with the same idempotency key returns the original allocation"]},{id:"US-002",title:"Release and expiry",as:"the order system",want:"stock returned when an order is cancelled or abandoned",so:"stock is not stranded",points:5,ac:["Releasing a HELD allocation returns quantity to available immediately","An allocation past expiresAt is treated as expired even if the sweeper has not run","Releasing an already-released allocation is idempotent"],edge:["Releasing a PICKED allocation is refused \u2014 that is a return, not a release","The sweeper expiring thousands of holds does not block allocation"]},{id:"US-003",title:"Record a receipt",as:"a warehouse operative",want:"to book supplier stock into a location",so:"it becomes available to sell",points:3,ac:["A receipt writes a positive ledger entry and raises on-hand and available","A receipt references the purchase order and advance shipping notice","A duplicate scan with the same idempotency key books once"],edge:["Receiving more than ordered is allowed but flagged for the controller","Receiving against a closed purchase order is refused"]},{id:"US-004",title:"Pick against an allocation",as:"a warehouse operative",want:"to confirm a pick",so:"the ledger reflects what left the building",points:5,ac:["A pick moves the allocation HELD \u2192 PICKED and writes a negative ledger entry","On-hand and allocated both fall; available is unchanged","Picking more than allocated is refused"],edge:["A partial pick is refused in v1 and returns a clear code","Picking an expired allocation is refused with a re-allocate instruction"]},{id:"US-005",title:"Replenishment suggestions",as:"a buyer",want:"suggestions when stock falls below the reorder point",so:"I order before we run out",points:5,ac:["A suggestion is raised when available + onOrder < reorderPoint","Only one OPEN suggestion exists per SKU and location","The suggestion records what was on order when it was raised"],edge:["Stock recovering above the reorder point does not auto-dismiss an open suggestion","A SKU with no rule raises nothing rather than erroring"]},{id:"US-006",title:"Cycle count and approval",as:"an inventory controller",want:"counts that disagree to be investigated and approved",so:"adjustments are deliberate",points:8,ac:["A count matching the system closes with no ledger entry","A variance within threshold auto-approves and writes an ADJUSTMENT","A variance above threshold requires approval by a different user"],edge:["The counter attempting to approve their own count is refused","A rejected count writes no adjustment and is retained for audit"]},{id:"US-007",title:"Transfer between DCs",as:"an inventory controller",want:"to move stock between distribution centres",so:"stock sits where demand is",points:5,ac:["A transfer writes TRANSFER_OUT and TRANSFER_IN atomically","Source availability is checked before the move","In-flight transfers are visible at both ends"],edge:["A transfer failing at the destination rolls back the source","A transfer to the same location is refused"]},{id:"US-008",title:"Historic position query",as:"an auditor",want:"the stock position for any SKU at any past date",so:"I can reconcile to the accounts",points:5,ac:["A position at a past instant is reconstructed by replaying the ledger","The figure reconciles with the finance extract for that date","A query over a SKU with no movements returns zero, not an error"],edge:["A date before the SKU existed returns zero","Reconstruction over 7 years of entries completes within the query timeout"]}],endpoints:[{m:"POST",p:"/api/v1/allocations",d:"Allocate stock for an order",role:"ORDER_SYSTEM"},{m:"DELETE",p:"/api/v1/allocations/{id}",d:"Release an allocation",role:"ORDER_SYSTEM"},{m:"POST",p:"/api/v1/allocations/{id}/pick",d:"Confirm a pick",role:"OPERATIVE"},{m:"POST",p:"/api/v1/movements/receipt",d:"Book a supplier receipt",role:"OPERATIVE"},{m:"POST",p:"/api/v1/movements/transfer",d:"Transfer between locations",role:"CONTROLLER"},{m:"GET",p:"/api/v1/stock/{sku}",d:"Current position across locations",role:"ALL AUTHENTICATED"},{m:"GET",p:"/api/v1/stock/{sku}/at",d:"Historic position at an instant",role:"CONTROLLER, AUDITOR"},{m:"POST",p:"/api/v1/counts",d:"Submit a cycle count",role:"OPERATIVE"},{m:"POST",p:"/api/v1/counts/{id}/approve",d:"Approve a variance",role:"SUPERVISOR"},{m:"GET",p:"/api/v1/suggestions",d:"Open purchase suggestions",role:"BUYER"}],vulns:[{cwe:"CWE-362",owasp:"A04:2021 Insecure Design",sev:"Critical",cvss:8.2,title:"Read-then-write allocation permits overselling",where:"AllocationService#allocate",fix:"The service SELECTs availability then INSERTs, with a race window between. Two requests for the last unit both succeed \u2014 the exact defect the project exists to fix. Replace with a conditional UPDATE whose WHERE clause carries the availability predicate, and treat zero updated rows as insufficient stock."},{cwe:"CWE-863",owasp:"A01:2021 Broken Access Control",sev:"High",cvss:7.7,title:"Count approval does not enforce segregation of duties",where:"CycleCountService#approve",fix:"BR-07 requires approvedBy \u2260 countedBy, but the check is absent. An operative can conceal shrinkage by counting and approving their own variance. Enforce in the domain and test it."},{cwe:"CWE-285",owasp:"A01:2021 Broken Access Control",sev:"High",cvss:7.1,title:"Adjustment endpoint open to any authenticated user",where:"MovementController#adjust",fix:"No role check. Any handheld credential can write an arbitrary ADJUSTMENT and make stock appear or disappear. Restrict to CONTROLLER and require an approved count reference."},{cwe:"CWE-89",owasp:"A03:2021 Injection",sev:"High",cvss:7.5,title:"SKU search concatenates user input into SQL",where:"SkuRepository#search",fix:"The LIKE pattern is built by string concatenation. Bind the parameter and escape LIKE metacharacters."},{cwe:"CWE-770",owasp:"A04:2021 Insecure Design",sev:"Medium",cvss:6.5,title:"Historic position query is unbounded",where:"StockController#at",fix:"Replaying seven years of entries for a fast-moving SKU is a self-inflicted DoS on a 99.9% endpoint. Add periodic snapshots and replay only from the latest one."},{cwe:"CWE-209",owasp:"A05:2021 Security Misconfiguration",sev:"Low",cvss:4.3,title:"Stack traces returned on 500",where:"Default error handler",fix:"Responses expose package structure and library versions. Return a correlation id; log the detail server-side."}],findings:[{sev:"High",kind:"Concurrency defect",where:"AllocationService#allocate:71",what:"Read-then-write with no lock or conditional predicate. Reproducible under 20 concurrent requests for a single unit.",fix:"Conditional UPDATE ... WHERE on_hand - allocated >= :qty, then check the affected row count."},{sev:"High",kind:"Derived value stored",where:"stock_position.available column",what:"available is both stored and computed in different code paths, and they disagree after a failed transaction.",fix:"Drop the column. BR-01 says derived; make the schema say it too, with a generated column or a view."},{sev:"High",kind:"Cyclomatic complexity",where:"MovementService#record \u2014 complexity 26",what:"One method handles six movement kinds with nested conditionals and per-kind side effects.",fix:"A MovementKind strategy per kind; the service resolves and delegates."},{sev:"Medium",kind:"Missing idempotency",where:"MovementController \u2014 receipt and pick",what:"A handheld retry over a flaky WLAN books the movement twice; this is a known source of phantom stock.",fix:"Require an Idempotency-Key header, unique in the ledger."},{sev:"Medium",kind:"N+1 query",where:"SuggestionService#open",what:"On-order quantity fetched per suggestion; 500 suggestions is 501 queries and the buyer screen times out.",fix:"One aggregate query joining open purchase orders."},{sev:"Medium",kind:"Transaction scope",where:"TransferService#transfer",what:"The out and in entries are written in separate transactions; a failure between them destroys stock.",fix:"One transaction. BR-09 already says atomic \u2014 the code does not implement it."},{sev:"Low",kind:"Magic numbers",where:"Expiry minutes, variance threshold and page size inline",what:"Operational tuning requires a redeploy.",fix:"An InventoryRules configuration bean."}],hardProblem:{title:"Never overselling the last unit",body:"Allocation sits directly in the order path at 60 requests per second, and it must be exactly right: if two customers are promised the same final unit, one of them gets a cancellation email, which is the failure the whole project exists to remove. A SELECT to check availability followed by an INSERT to reserve has a window between the two statements in which both requests see stock. Locking the SKU row serialises every order for a popular product at exactly the moment a promotion makes it popular.",solution:"Make the check and the reservation one statement. `UPDATE stock_position SET allocated = allocated + :qty WHERE sku_id = :sku AND location_id = :loc AND on_hand - allocated >= :qty` either affects one row or none, atomically, at read-committed isolation. Zero rows means insufficient stock \u2014 return 409. There is no window, no application-held lock, and no serialisation beyond the row itself, so unrelated SKUs never contend. The same predicate is the definition of availability in BR-01, so the invariant is enforced in exactly one place rather than restated in application code that can drift."},metrics:[{k:"SKUs",v:"45,000"},{k:"Distribution centres",v:"3"},{k:"Stores served",v:"180"},{k:"Oversell cancellations / quarter",v:"3,100"},{k:"Peak allocations / s",v:"60"},{k:"Ledger entries / day",v:"~400k"}]},{id:"enrolment",title:"Student Enrolment & Timetabling",short:"Enrolment & Timetabling",domain:"Higher education",stack:"Python, FastAPI, PostgreSQL, Celery",stackList:["Python 3.12","FastAPI","PostgreSQL 15","Celery","Redis","Alembic"],summary:"14,000 students choosing modules against finite room and staff capacity.",requirement:"Our university enrols about 14,000 students across 60 programmes and module selection is chaos. Enrolment opens at 09:00 on a single day, everyone hits it at once, popular modules fill in seconds, and every year we manually untangle hundreds of students with impossible timetables.\n\nWhat we need\n- A module catalogue: each module has a code, credit value, a teaching pattern (lectures, seminars, labs each with a frequency and duration), a capacity, and prerequisites expressed against other modules.\n- Programme rules: each programme specifies how many credits a student must take per term, which modules are compulsory, and which optional pools they choose from and how many from each.\n- Enrolment: a student selects modules. The system must validate prerequisites, credit totals, programme rules, capacity, and \u2014 critically \u2014 that the resulting timetable has no clash. A clash means two teaching events for the same student at overlapping times.\n- Waiting lists: when a module is full a student may join a waiting list. If a place frees, the next eligible student on the list is offered it and has 24 hours to accept.\n- Timetabling: the timetable is generated centrally before enrolment opens, assigning each teaching event a room and a slot. Rooms have capacities and features (lab benches, projectors). We are not asking you to write an optimiser \u2014 assume the schedule is imported \u2014 but enrolment must respect it and detect clashes against it.\n- Staff view: module leaders see their enrolled cohort and can export a register.\n\nWho uses it: students (select and change modules), academic advisors (approve exceptions, override prerequisites with a reason), timetabling office (import and amend the schedule), module leaders (view cohort, export registers), and registry (reporting and audit).\n\nNon-functional. 14,000 students, but the load is extremely peaky \u2014 we expect 6,000 concurrent sessions in the first ten minutes, and several hundred requests per second against the popular modules. Capacity must never be exceeded, even under that load. A student's enrolment must be atomic: either every selected module is taken or none is, because a partial enrolment produces exactly the impossible timetables we are trying to eliminate. Enrolment history is retained for the student's lifetime plus 6 years for degree verification.\n\nOut of scope: timetable optimisation itself, room booking outside teaching, fee calculation, accommodation, and anything to do with assessment or grades.",actors:[{name:"Student",can:"Browse the catalogue, select and change modules within the enrolment window, join and leave waiting lists."},{name:"Academic advisor",can:"Approve exceptions, override a prerequisite with a recorded reason, enrol a student outside the window."},{name:"Timetabling office",can:"Import and amend the teaching schedule; must be warned when an amendment would clash for already-enrolled students."},{name:"Module leader",can:"View the enrolled cohort and waiting list for their modules; export a register."},{name:"Registry",can:"Reporting and audit across all programmes; read-only on enrolment data."}],entities:[{name:"Module",fields:["id: UUID","code: str","title: str","credits: int","capacity: int","prerequisites: PrereqExpr","termId: UUID"],note:"Prerequisites are an expression tree \u2014 (A AND B) OR C \u2014 not a flat list."},{name:"TeachingEvent",fields:["id: UUID","moduleId","kind: LECTURE|SEMINAR|LAB","dayOfWeek","start: time","durationMinutes: int","roomId","weeks: WeekPattern"],note:"weeks matters: two events sharing a slot in different weeks do not clash."},{name:"Programme",fields:["id: UUID","name: str","creditsPerTerm: int","compulsory: List[ModuleRef]","pools: List[OptionPool]"],note:'A pool is "choose N from this set".'},{name:"Enrolment",fields:["id: UUID","studentId","moduleId","termId","state: ENROLLED|WITHDRAWN|WAITLISTED","enrolledAt: datetime"],note:"One row per student-module-term; the unique constraint prevents double enrolment."},{name:"WaitlistEntry",fields:["id: UUID","moduleId","studentId","position: int","offeredAt: datetime?","offerExpiresAt: datetime?"],note:"Position is maintained on insert and on removal; the offer window is 24h."},{name:"Student",fields:["id: UUID","programmeId","yearOfStudy: int","completedModules: Set[ModuleRef]"],note:"completedModules is what prerequisite expressions evaluate against."}],rules:[{id:"BR-01",text:"A student may not enrol on a module whose prerequisite expression evaluates false against their completed modules, unless an advisor override exists."},{id:"BR-02",text:"Enrolled credits per term must equal the programme's creditsPerTerm exactly at submission \u2014 not more, not less."},{id:"BR-03",text:"All compulsory modules for the programme and year must be included."},{id:"BR-04",text:"Each option pool must be satisfied exactly: choose N from the pool, no more, no fewer."},{id:"BR-05",text:"No two teaching events in a student's selection may overlap in time in a week they share."},{id:"BR-06",text:"Enrolled headcount for a module must never exceed its capacity, under any concurrency."},{id:"BR-07",text:"A submission is atomic: every module is enrolled or none is."},{id:"BR-08",text:"When a place frees, the earliest eligible waitlist entry is offered it and expires in 24 hours; expiry passes to the next."},{id:"BR-09",text:"An advisor override records the advisor, the rule waived and a reason, and is visible on the student record."},{id:"BR-10",text:"A schedule amendment that would create a clash for an enrolled student is refused, listing the affected students."}],nfrs:[{k:"Peak concurrency",v:"6,000 concurrent sessions in the first 10 minutes"},{k:"Submission latency",v:"p95 < 1 s for a full 6-module submission including clash checking"},{k:"Capacity correctness",v:"Never exceeded, even at several hundred req/s on one module"},{k:"Atomicity",v:"A submission is all-or-nothing; partial enrolment is impossible"},{k:"Availability",v:"99.9% during the enrolment window; degraded read-only is unacceptable"},{k:"Retention",v:"Enrolment history for lifetime + 6 years for degree verification"},{k:"Fairness",v:"Waitlist offers strictly in position order; no queue jumping"}],risks:[{r:"Capacity exceeded under the 09:00 stampede",i:"Critical",mit:"Conditional UPDATE incrementing enrolled_count only WHERE enrolled_count < capacity; zero rows means full. No read-then-write window."},{r:"Partial enrolment leaves an impossible timetable",i:"Critical",mit:"One transaction per submission covering every module; any failure rolls the whole submission back."},{r:"Clash detection too slow inside the transaction",i:"High",mit:"Teaching events for a term are loaded into an interval index in Redis; the check is in-memory over ~6 modules, not a database join per pair."},{r:"Thundering herd collapses the database",i:"High",mit:"Connection pool bounded well below the concurrency, a queue in front of submission, and the catalogue served from cache \u2014 reads must not compete with writes."},{r:"Waitlist offers race when several places free at once",i:"Medium",mit:"Offers issued by a single serialised worker per module, not by the request thread."},{r:"Prerequisite expressions become unmaintainable",i:"Medium",mit:"A small parsed expression tree with a pure evaluator and property tests, not free-text rules."}],unknowns:["Can a student exceed creditsPerTerm with advisor approval, or is it a hard equality?","When a schedule amendment would clash, who resolves it \u2014 the timetabling office or the affected students?","Is the waitlist offer window 24 hours including weekends?","Do withdrawn modules free a place immediately, or at the end of the change window?","Can an advisor override capacity as well as prerequisites?","Are part-time students subject to the same exact-credit rule?"],integrations:["Student records system \u2014 source of truth for programme, year and completed modules","University SSO (SAML/OIDC) \u2014 student and staff identity","Timetabling system \u2014 schedule import (CSV/API), read-only in v1","Email/notification service \u2014 waitlist offers and expiry warnings","Reporting warehouse \u2014 nightly extract for registry"],outOfScope:["Timetable optimisation and room allocation","Non-teaching room booking","Fee calculation","Accommodation","Assessment, grades and progression","Graduation and awards"],stories:[{id:"US-001",title:"Browse the catalogue",as:"a student",want:"to see modules available to me with their teaching pattern",so:"I can plan a selection",points:3,ac:["Only modules for my programme, year and term are listed","Each module shows credits, capacity, places remaining and its teaching events","Modules whose prerequisites I do not meet are marked, not hidden"],edge:["The catalogue is served under peak load without competing with submissions","A module with no remaining places shows a waitlist option"]},{id:"US-002",title:"Validate a selection",as:"a student",want:"immediate feedback on whether my selection is legal",so:"I fix problems before submitting",points:8,ac:["Validation reports credit total, missing compulsory modules, unsatisfied pools, failed prerequisites and clashes","Every failure names the specific rule and modules involved","Validation is side-effect free and does not hold capacity"],edge:["Two events in the same slot but different week patterns do not clash","A selection exactly meeting every rule validates clean"]},{id:"US-003",title:"Submit an enrolment atomically",as:"a student",want:"my whole selection enrolled together or not at all",so:"I never end up half enrolled",points:13,ac:["A valid submission enrols every module in one transaction","If any module is full at commit, nothing is enrolled and the full module is named","Concurrent submissions cannot take a module past capacity"],edge:["Submitting twice enrols once","A submission racing the last place \u2014 exactly one student gets it","A crash mid-submission leaves no partial state"]},{id:"US-004",title:"Join a waiting list",as:"a student",want:"to queue for a full module",so:"I get a place if one frees",points:5,ac:["Joining a full module creates a WaitlistEntry at the end of the queue","My position is visible and stable","Joining twice is idempotent"],edge:["Leaving the list renumbers positions correctly","Joining a module I am enrolled on is refused"]},{id:"US-005",title:"Waitlist offer and expiry",as:"the system",want:"to offer a freed place to the next eligible student",so:"places are filled fairly",points:8,ac:["A withdrawal offers the place to position 1, expiring in 24h","An expired offer passes to the next entry","An offer is only made to a student for whom the module still validates"],edge:["Several places freeing at once are offered in order, not all to one student","A student whose timetable now clashes is skipped with a reason"]},{id:"US-006",title:"Advisor override",as:"an academic advisor",want:"to waive a prerequisite with a reason",so:"genuine exceptions are possible without breaking v1/modules/{id}/register",d:"Cohort register + CSV",role:"MODULE_LEADER"}],vulns:[{cwe:"CWE-362",owasp:"A04:2021 Insecure Design",sev:"Critical",cvss:8.2,title:"Capacity check races under concurrent enrolment",where:"EnrolmentService.submit",fix:"count() then insert leaves a window; at 09:00 several hundred requests hit one module and capacity is exceeded by dozens. Use a conditional UPDATE on enrolled_count WHERE enrolled_count < capacity and treat zero rows as full."},{cwe:"CWE-639",owasp:"A01:2021 Broken Access Control",sev:"Critical",cvss:8.1,title:"Any student can withdraw any enrolment",where:"EnrolmentController.withdraw",fix:"The handler takes an enrolment id and deletes it with no ownership check. A student can withdraw a rival from a full module and take the place. Verify ownership or ADVISOR role."},{cwe:"CWE-285",owasp:"A01:2021 Broken Access Control",sev:"High",cvss:7.1,title:"Register export not scoped to the requesting leader",where:"ModuleController.register",fix:"Any authenticated staff member can export any cohort, which is personal data for 14,000 students. Scope to modules the caller leads."},{cwe:"CWE-770",owasp:"A04:2021 Insecure Design",sev:"High",cvss:7.5,title:"No rate limiting on validate or submit",where:"All /api/v1 enrolment routes",fix:"Validation is expensive and unauthenticated-adjacent; a script can deny the enrolment window to everyone. Per-subject limits plus a submission queue."},{cwe:"CWE-799",owasp:"A04:2021 Insecure Design",sev:"Medium",cvss:5.9,title:"Waitlist accept has no replay protection",where:"WaitlistController.accept",fix:"A replayed accept can consume a second freed place out of order. Make the offer token single-use."},{cwe:"CWE-532",owasp:"A09:2021 Logging Failures",sev:"Medium",cvss:5.3,title:"Student identifiers and selections logged at INFO",where:"EnrolmentService.submit",fix:"Module choices are personal data revealing disability adjustments in some cases. Log the enrolment UUID only."}],findings:[{sev:"High",kind:"Concurrency defect",where:"EnrolmentService.submit:118",what:"Capacity verified with a count query before insert; reproducible overshoot under 200 concurrent requests.",fix:"Conditional UPDATE with the predicate in the WHERE clause; check rowcount."},{sev:"High",kind:"Cyclomatic complexity",where:"SelectionValidator.validate \u2014 complexity 34",what:"Credits, compulsory, pools, prerequisites and clashes all in one function with early returns that skip later checks, so a student sees one error at a time.",fix:"One validator per rule returning violations; the orchestrator collects all of them. This also fixes the poor error reporting."},{sev:"High",kind:"Performance",where:"ClashDetector.detect",what:"Pairwise comparison querying teaching events per pair \u2014 O(n\xb2) queries inside the submission transaction, holding locks under peak load.",fix:"Load the term's events once into an interval tree; detection becomes in-memory over ~20 events."},{sev:"Medium",kind:"Transaction scope",where:"EnrolmentService.submit",what:"Each module is enrolled in its own transaction, so a failure on module 5 leaves 4 enrolled \u2014 precisely the partial state BR-07 forbids.",fix:"One transaction for the whole submission."},{sev:"Medium",kind:"Missing null handling",where:"PrereqEvaluator.evaluate:52",what:"completedModules may be None for a first-year student; the expression walker dereferences it.",fix:"Default to an empty set and add the first-year case to the tests."},{sev:"Medium",kind:"Duplication",where:"Week-pattern overlap logic in ClashDetector and ScheduleAmendService",what:"Two implementations disagree on alternating-week patterns, so an amendment can create a clash the validator would have caught.",fix:"One WeekPattern.overlaps used by both."},{sev:"Low",kind:"Magic numbers",where:"24, 6, 120 inline for offer window, credits and page size",what:"Policy constants not centralised.",fix:"An EnrolmentRules settings object."}],hardProblem:{title:"Six thousand students hitting one popular module at 09:00",body:"Enrolment is the opposite of steady load: nothing, then a stampede, then nothing. Two invariants must hold through it. Capacity must never be exceeded, which a count-then-insert cannot guarantee. And a submission must be all-or-nothing across six modules, because a partial enrolment produces exactly the impossible timetable the project exists to eliminate. Doing both naively means holding a long transaction across six capacity checks and a clash computation while several hundred requests queue behind it.",solution:"Shrink what happens inside the transaction, and let the database enforce capacity. Clash detection and rule validation run before the transaction opens, against an in-memory interval index of the term's teaching events \u2014 no locks held during the expensive part. Inside the transaction, each module is claimed with a single conditional UPDATE incrementing enrolled_count only while it is below capacity; zero affected rows means full, and the whole transaction rolls back naming that module. The transaction therefore holds only row locks, for the duration of six fast UPDATEs, and the all-or-nothing guarantee is the transaction itself rather than application compensation logic."},metrics:[{k:"Students",v:"14,000"},{k:"Programmes",v:"60"},{k:"Peak concurrent sessions",v:"6,000"},{k:"Enrolment window",v:"1 day"},{k:"Modules per student / term",v:"~6"},{k:"Retention",v:"Lifetime + 6 years"}]}],zi=e=>wd.find(n=>n.id===e)??wd[0],Ie=(e,n)=>[`| ${e.join(" | ")} |`,`|${e.map(()=>"---").join("|")}|`,...n.map(t=>`| ${t.join(" | ")} |`)].join("\n"),gr=(e,n,t,r)=>`> **Agent** ${n} \xb7 **Workspace** ${e.title} \xb7 **Mode** ${t}`+(r?` \xb7 **Scope** ${r.id} ${r.title}`:"")+`\n> **Generated** 2026-08-29 \xb7 **Stack** ${e.stack}\n`,t6=e=>{const n=e.toLowerCase();return n.includes("latency")||n.includes("lookup")||n.includes("search")?"Indexed access paths sized to the query, a read cache for the hot path invalidated on write, and           TEXT PRIMARY KEY,          -- idempotency key, BR-01\n    tenant_id   UUID NOT NULL,\n    dimension   TEXT NOT NULL,\n    quantity    NUMERIC(20,6) NOT NULL CHECK (quantity >= 0),\n    occurred_at TIMESTAMPTZ NOT NULL,\n    received_at TIMESTAMPTZ NOT NULL DEFAULT now()\n);\nCREATE INDEX usage_period ON usage_event (tenant_id, dimension, occurred_at);\n\nCREATE TABLE invoice (\n    id           UUID PRIMARY KEY,\n    tenant_id    UUID NOT NULL,\n    period_start DATE NOT NULL,\n    period_end   DATE NOT NULL,\n    plan_version INTEGER NOT NULL,          -- pinned, BR-07\n    state        TEXT NOT NULL,\n    subtotal     NUMERIC(20,2) NOT NULL,    -- NUMERIC, never float\n    total        NUMERIC(20,2) NOT NULL,\n\n    -- A crashed billing run must resume, not duplicate.\n    UNIQUE (tenant_id, period_start)\n);":"CREATE TABLE telemetry_frame (\n    vehicle_id  UUID NOT NULL REFERENCES vehicle(id),\n    at          TIMESTAMPTZ NOT NULL,\n    position    GEOGRAPHY(POINT, 4326),\n    odometer_km BIGINT,\n    coolant_c   NUMERIC(5,2),\n    dtcs        TEXT[],\n\n    -- BR-09: at-least-once delivery, so identity must be idempotent.\n    PRIMARY KEY (vehicle_id, at)\n);\nSELECT create_hypertable('telemetry_frame', 'at', chunk_time_interval => INTERVAL '1 day');\n\nCREATE TABLE alert (\n    id          UUID PRIMARY KEY,\n    rule_id     UUID NOT NULL,\n    vehicle_id  UUID NOT NULL,\n    raised_at   TIMESTAMPTZ NOT NULL,\n    cleared_at  TIMESTAMPTZ,\n\n    -- BR-06: one open alert per rule and vehicle; re-firing updates.\n    CONSTRAINT one_open_alert EXCLUDE (rule_id WITH =, vehicle_id WITH =)\n        WHERE (cleared_at IS NULL)\n);"}const u6=e=>{const n=e.findings.map(t=>t.where.match(/complexity (\d+)/)).filter(Boolean).map(t=>Number(t[1]));return n.length?Math.max(...n):24};function pe(e){return e.replace(/[^a-zA-Z0-9]+(.)?/g,(n,t)=>t?t.toUpperCase():"").replace(/^./,n=>n.toUpperCase())}const m6={1:function XH(e,n){return`# Requirement Analysis \u2014 ${e.title}\n\n${gr(e,"RequirementAnalysisRefinementAgent",n)}\n## 1. Structured summary\n\n### 1.1 Purpose\n${e.summary} This document refines the raw brief into a scoped, testable requirement package. Nothing below is invented: where the brief is silent, the gap is raised in \xa75 rather than assumed.\n\n### 1.2 Domain context\n${Ie(["Metric","Value"],e.metrics.map(t=>[t.k,t.v]))}\n\n### 1.3 Actors and responsibilities\n${Ie(["Actor","Responsibilities"],e.actors.map(t=>[`**${t.name}**`,t.can]))}\n\n## 2. Scope\n\n### 2.1 In scope\n${e.stories.map(t=>`- **${t.id}** ${t.title} \u2014 ${t.want}`).join("\n")}\n\n### 2.2 Explicitly out of scope\n${e.outOfScope.map(t=>`- ${t}`).join("\n")}\n\nAnything not listed in \xa72.1 is out of scope by default. Adding to \xa72.1 after\napproval is a change request, not a clarification.\n\n## 3. Business rules\n\nThese are the rules the downstream stages must preserve. Each is stated so it\ncan be tested rather than interpreted.\n\n${Ie(["ID","Rule"],e.rules.map(t=>[`\`${t.id}\``,t.text]))}\n\n## 4. Constraints\n\n### 4.1 Non-functional\n${Ie(["Attribute","Requirement"],e.nfrs.map(t=>[t.k,t.v]))}\n\n### 4.2 Integration constraints\n${e.integrations.map(t=>`- ${t}`).join("\n")}\n\n### 4.3 Data and retention\nPersonal data in scope is limited to what the brief names. Retention is stated\nin \xa74.1 and must be implemented as an enforced policy, not a convention.\n\n## 5. Open questions\n\nThe brief does not settle these. Each one changes the design, so each needs an\nanswer before the affected stage is approved. They are **not** blocking this\ndocument \u2014 they are blocking the stages named.\n\n${Ie(["#","Question","Blocks"],e.unknowns.map((t,r)=>[String(r+1),t,r<2?"HLS, HLD":r<4?"LLD":"CODE"]))}\n\n## 6. Acceptance criteria\n\nDeterministic and measurable. "Fast", "reliable" and "user-friendly" do not\nappear; every criterion below can be evaluated to true or false.\n\n${e.rules.map((t,r)=>`**AC-${String(r+1).padStart(2,"0")}** (${t.id}
